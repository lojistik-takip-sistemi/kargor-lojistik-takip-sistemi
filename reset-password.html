<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Yeni Şifre Belirle</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: rgba(255,255,255,0.05); padding: 30px; border-radius: 20px; text-align: center; width: 350px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; }
        button { background: #ff4e50; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Yeni Şifre Belirle</h2>
        <input type="password" id="newPass" placeholder="Yeni Şifreniz">
        <button onclick="resetPassword()">Şifreyi Güncelle</button>
        <p id="msg"></p>
    </div>

    <script>
        function resetPassword() {
            const urlParams = new URLSearchParams(window.location.search);
            const uid = urlParams.get('uid');
            const token = urlParams.get('token');
            const newPass = document.getElementById('newPass').value;

            fetch('http://127.0.0.1:8000/api/password-reset-confirm/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ uid: uid, token: token, new_password: newPass })
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('msg').innerText = data.message || data.error;
                if(data.message) setTimeout(() => window.location.href = 'index.html', 2000);
            });
        }
    </script>
</body>
</html>
