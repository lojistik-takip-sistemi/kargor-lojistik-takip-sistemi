<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kargor | Operasyon Paneli</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #ff4e50; --secondary: #f9d423; --bg: #0f172a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #0f172a; color: white; display: flex; height: 100vh; }
        .sidebar { width: 280px; background: rgba(255,255,255,0.02); padding: 40px 20px; border-right: 1px solid rgba(255,255,255,0.1); }
        .main { flex: 1; padding: 40px; overflow-y: auto; }
        .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); padding: 25px; border-radius: 20px; margin-bottom: 20px; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
        .search-bar { width: 100%; padding: 12px 20px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; color: white; margin-bottom: 20px; outline: none; }
        .item-row { display: flex; justify-content: space-between; padding: 15px; background: rgba(255,255,255,0.02); border-radius: 12px; margin-bottom: 10px; }
        .status { padding: 5px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; }
        .delivered { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
        .in-transit { background: rgba(249, 212, 35, 0.2); color: #f9d423; }
        .add-btn { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 12px; cursor: pointer; }
        .chart-container { height: 250px; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <nav class="sidebar">
        <h2 style="color: var(--primary); margin-bottom: 40px;"><i class="fa-solid fa-truck-fast"></i> KARGOR</h2>
        <ul style="list-style: none;">
            <li style="margin-bottom: 20px; color: white;"><i class="fa-solid fa-gauge"></i> Kontrol Paneli</li>
            <li style="margin-bottom: 20px; color: #94a3b8;"><i class="fa-solid fa-boxes-stacked"></i> Sevkiyatlar</li>
        </ul>
    </nav>
    <main class="main">
        <header style="display:flex; justify-content: space-between; margin-bottom: 30px;">
            <h1>Operasyon Merkezi</h1>
            <button id="logoutBtn" class="add-btn" style="background:rgba(255,255,255,0.1);">Çıkış</button>
        </header>

        <div class="stats">
            <div class="card"><h4>Aktif Kargolar</h4><h2 id="stat-total">0</h2></div>
            <div class="card"><h4>Teslim Edilenler</h4><h2 id="stat-delivered">0</h2></div>
            <div class="card chart-container"><canvas id="myChart"></canvas></div>
        </div>

        <input type="text" id="searchInput" class="search-bar" placeholder="Takip numarası ile kargo ara...">

        <div class="card">
            <div style="display:flex; justify-content: space-between; margin-bottom: 20px;">
                <h3>Anlık Hareketler</h3>
                <button id="openModalBtn" class="add-btn">+ Yeni Kargo</button>
            </div>
            <div id="shipment-list"></div>
        </div>
    </main>

    <div id="kargoModal" class="modal">
        <div class="card" style="width:400px;">
            <h3>Yeni Kargo</h3><br>
            <form id="kargoForm">
                <input type="text" id="track_no" placeholder="Takip No" class="search-bar" required>
                <input type="number" id="weight" placeholder="Ağırlık (kg)" class="search-bar" required>
                <input type="number" id="branch_id" placeholder="Şube ID" class="search-bar" required>
                <input type="number" id="sender_id" placeholder="Gönderici ID" class="search-bar" required>
                <input type="number" id="receiver_id" placeholder="Alıcı ID" class="search-bar" required>
                <button type="submit" class="add-btn" style="width:100%;">Kaydet</button>
                <button type="button" id="closeModal" style="width:100%; background:none; border:none; color:gray; margin-top:10px; cursor:pointer;">Kapat</button>
            </form>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
