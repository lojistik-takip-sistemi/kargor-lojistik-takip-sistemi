<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kargor | Yeni Şifre Belirle</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #ff4e50;
            --secondary: #f9d423;
            --bg-dark: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body {
            background: radial-gradient(circle at center, #1e293b, #0f172a);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: var(--text-main);
        }

        /* Arka Plan Animasyonlu Blob */
        .bg-blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            filter: blur(120px);
            opacity: 0.12;
            z-index: -1;
            border-radius: 50%;
            animation: moveAround 25s infinite alternate;
        }

        @keyframes moveAround {
            from { transform: translate(-150px, -150px) rotate(0deg); }
            to { transform: translate(150px, 150px) rotate(360deg); }
        }

        /* Glassmorphism Kart Tasarımı */
        .reset-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 50px 40px;
            border-radius: 32px;
            width: 420px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .brand-logo {
            font-size: 45px;
            margin-bottom: 20px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h2 { font-size: 24px; font-weight: 700; color: white; margin-bottom: 12px; }
        p { color: var(--text-muted); font-size: 14px; margin-bottom: 30px; line-height: 1.6; }

        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { 
            display: block; 
            color: #94a3b8; 
            font-size: 11px; 
            margin-bottom: 8px; 
            margin-left: 15px; 
            text-transform: uppercase; 
            font-weight: 600;
            letter-spacing: 1px; 
        }
        
        .input-field {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-field i { position: absolute; left: 20px; color: #64748b; font-size: 16px; }

        .input-field input {
            width: 100%;
            padding: 16px 20px 16px 50px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .input-field input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 25px rgba(255, 78, 80, 0.15);
        }

        .save-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 18px;
            background: linear-gradient(135deg, var(--primary), #b91c1c);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 15px -3px rgba(239, 68, 68, 0.3);
            margin-top: 10px;
        }

        .save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(239, 68, 68, 0.4);
        }

        .save-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status-msg {
            margin-top: 25px;
            padding: 12px;
            border-radius: 14px;
            font-size: 13px;
            display: none;
            line-height: 1.4;
        }

        .success { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); color: #34d399; }
        .error { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: #f87171; }

        .back-link {
            display: block;
            margin-top: 25px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            transition: 0.3s;
        }
        .back-link:hover { color: white; }
    </style>
</head>
<body>
    <div class="bg-blob"></div>

    <div class="reset-card">
        <div class="brand-logo">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h2>Yeni Şifre Oluştur</h2>
        <p>Hesabınız için güçlü ve güvenli bir şifre belirleyin. İşlemden sonra giriş sayfasına yönlendirileceksiniz.</p>

        <form id="newPasswordForm">
            <div class="input-group">
                <label>Yeni Şifre</label>
                <div class="input-field">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="newPass" placeholder="••••••••" required minlength="6">
                </div>
            </div>

            <div class="input-group">
                <label>Yeni Şifre (Tekrar)</label>
                <div class="input-field">
                    <i class="fa-solid fa-circle-check"></i>
                    <input type="password" id="confirmPass" placeholder="••••••••" required minlength="6">
                </div>
            </div>

            <button type="submit" class="save-btn" id="saveBtn">
                Şifreyi Güncelle ve Kaydet
            </button>
            
            <div id="statusMessage" class="status-msg"></div>

            <a href="/" class="back-link">
                <i class="fa-solid fa-arrow-left" style="margin-right: 5px; font-size: 11px;"></i> Vazgeç ve Geri Dön
            </a>
        </form>
    </div>

    <script>
        document.getElementById('newPasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // URL'den UID ve Token bilgilerini çek
            const urlParams = new URLSearchParams(window.location.search);
            const uid = urlParams.get('uid');
            const token = urlParams.get('token');

            const password = document.getElementById('newPass').value;
            const confirm = document.getElementById('confirmPass').value;
            const statusBox = document.getElementById('statusMessage');
            const btn = document.getElementById('saveBtn');

            // Kontroller
            if (!uid || !token) {
                showStatus("Hatalı veya eksik bağlantı. Lütfen e-postanızdaki linki kontrol edin.", "error");
                return;
            }

            if (password !== confirm) {
                showStatus("Girdiğiniz şifreler birbiriyle eşleşmiyor!", "error");
                return;
            }

            // Görsel Başlatma
            btn.disabled = true;
            btn.innerText = "Güncelleniyor...";
            statusBox.style.display = "none";

            // Backend API Çağrısı
            fetch('https://kargor-lojistik-takip-sistemi.onrender.com/api/password-reset-confirm/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    uid: uid,
                    token: token,
                    password: password
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.message.toLowerCase().includes("başarıyla") || data.message.toLowerCase().includes("güncellendi")) {
                    showStatus("Şifreniz başarıyla güncellendi! Giriş sayfasına yönlendiriliyorsunuz...", "success");
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 2500);
                } else {
                    showStatus(data.message || "Bir hata oluştu. Bağlantı süresi dolmuş olabilir.", "error");
                    btn.disabled = false;
                    btn.innerText = "Şifreyi Güncelle ve Kaydet";
                }
            })
            .catch(err => {
                showStatus("Sunucu bağlantı hatası! Lütfen daha sonra tekrar deneyin.", "error");
                btn.disabled = false;
                btn.innerText = "Şifreyi Güncelle ve Kaydet";
            });
        });

        function showStatus(text, type) {
            const statusBox = document.getElementById('statusMessage');
            statusBox.innerText = text;
            statusBox.className = "status-msg " + type;
            statusBox.style.display = "block";
        }
    </script>
</body>
</html>
