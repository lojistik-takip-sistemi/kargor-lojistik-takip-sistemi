<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kargor | Personel Görev Takibi</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg-dark: #0f172a;
            --sidebar-bg: #1e293b;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        /* KRİTİK DÜZELTME: min-height yerine height kullanıldı */
        body { background: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar Yapısı (Admin ile Tutarlı) */
        .sidebar { width: 260px; background: var(--sidebar-bg); display: flex; flex-direction: column; padding: 30px 20px; border-right: 1px solid var(--border-color); }
        .logo { color: var(--primary); font-size: 24px; font-weight: 800; margin-bottom: 50px; text-align: center; letter-spacing: 1px; }
        .nav-menu { display: flex; flex-direction: column; gap: 10px; }
        .nav-item { padding: 14px 20px; border-radius: 12px; cursor: pointer; transition: 0.3s; color: var(--text-muted); display: flex; align-items: center; gap: 12px; font-weight: 500; text-decoration: none; }
        .nav-item:hover, .nav-item.active { background: rgba(59, 130, 246, 0.1); color: var(--primary); }
        .logout-btn { margin-top: auto; color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); background: rgba(239, 68, 68, 0.05); }
        .logout-btn:hover { background: var(--danger); color: white; }

        /* Ana İçerik Alanı */
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        /* İstatistik Kartları */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card-bg); padding: 25px; border-radius: 24px; border: 1px solid var(--border-color); backdrop-filter: blur(10px); }
        .stat-card h4 { color: var(--text-muted); font-size: 13px; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 0.5px; }
        .stat-card h2 { font-size: 32px; font-weight: 700; }

        /* Arama Çubuğu */
        .search-bar { width: 100%; padding: 16px; margin-bottom: 25px; border-radius: 16px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); color: white; outline: none; transition: 0.3s; }
        .search-bar:focus { border-color: var(--primary); background: rgba(255, 255, 255, 0.08); }

        /* Görev Listesi Bölümleri */
        .panel-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 30px; }
        .section-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }

        /* Kargo Kartları */
        .task-card { background: var(--card-bg); padding: 20px; border-radius: 20px; border: 1px solid var(--border-color); margin-bottom: 15px; transition: 0.3s; position: relative; }
        .task-card:hover { transform: translateY(-3px); border-color: rgba(255,255,255,0.2); }
        .task-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .task-code { font-size: 11px; font-weight: 700; color: var(--primary); background: rgba(59, 130, 246, 0.1); padding: 4px 8px; border-radius: 6px; }
        
        .route-info { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; font-weight: 500; font-size: 14px; }
        .route-info i { color: var(--text-muted); font-size: 12px; }
        
        .task-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; }
        
        .task-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 15px; border-top: 1px solid var(--border-color); }
        .task-date { font-size: 12px; color: var(--text-muted); }

        /* Butonlar */
        .btn { padding: 10px 18px; border-radius: 10px; border: none; cursor: pointer; font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .btn-success { background: var(--success); color: white; }
        .btn-warning { background: var(--warning); color: white; }
        .btn-success:hover, .btn-warning:hover { filter: brightness(1.1); transform: scale(1.02); }

        /* Modallar */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(10px); }
        .modal-content { background: #1e293b; padding: 35px; border-radius: 28px; width: 450px; border: 1px solid var(--border-color); }
        .modal-content h3 { margin-bottom: 20px; }
        label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; font-weight: 600; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: white; outline: none; }
        input:focus { border-color: var(--primary); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">KARGOR</div>
        <div class="nav-menu">
            <div class="nav-item active"><i class="fa-solid fa-truck-ramp-box"></i> Görev Takibi</div>
            <div class="nav-item" onclick="openProfileModal()"><i class="fa-solid fa-user-gear"></i> Profilim</div>
            <div class="nav-item" style="opacity: 0.5; cursor: default;"><i class="fa-solid fa-chart-line"></i> Performansım</div>
        </div>
        <button onclick="logout()" class="nav-item logout-btn"><i class="fa-solid fa-power-off"></i> Güvenli Çıkış</button>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <div>
                <h1 style="font-size: 26px;">Hoş Geldin, <span id="personelName" style="color: var(--primary);">Kurye</span>!</h1>
                <p style="color: var(--text-muted); font-size: 14px;">Bugün teslim etmen gereken kargolar aşağıda listelenmiştir.</p>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h4>Bekleyen Görevler</h4>
                <h2 id="statTodo">0</h2>
            </div>
            <div class="stat-card" style="border-left: 4px solid var(--warning);">
                <h4>Yoldaki Paketler</h4>
                <h2 id="statInProgress" style="color: var(--warning);">0</h2>
            </div>
            <div class="stat-card" style="border-left: 4px solid var(--success);">
                <h4>Tamamlananlar</h4>
                <h2 id="statDone" style="color: var(--success);">0</h2>
            </div>
        </div>

        <input type="text" id="searchInput" class="search-bar" placeholder="Kargo kodu, içerik veya adres bilgisi ile arama yapın...">

        <div class="panel-grid">
            <div>
                <h3 class="section-title"><i class="fa-solid fa-route" style="color: var(--primary);"></i> Aktif Teslimatlar</h3>
                <div id="activeTasksList">
                    <p style="color: var(--text-muted); padding: 20px;">Yükleniyor...</p>
                </div>
            </div>

            <div>
                <h3 class="section-title"><i class="fa-solid fa-clock-rotate-left" style="color: var(--success);"></i> Biten İşler</h3>
                <div id="completedTasksList">
                    <p style="color: var(--text-muted); padding: 20px;">Yükleniyor...</p>
                </div>
            </div>
        </div>
    </div>

    <div id="profileModal" class="modal">
        <div class="modal-content">
            <h3>Profil Ayarlarım</h3>
            <form id="profileForm">
                <label>Kullanıcı Adı</label>
                <input type="text" id="profileUsername" disabled style="opacity: 0.5;">
                
                <label>Tam Ad Soyad</label>
                <input type="text" id="profileFullName" required>
                
                <label>E-posta Adresi</label>
                <input type="email" id="profileEmail" required>
                
                <div style="background: rgba(59, 130, 246, 0.05); padding: 15px; border-radius: 15px; border: 1px solid rgba(59, 130, 246, 0.1); margin-top: 10px;">
                    <h4 style="font-size: 12px; color: var(--primary); margin-bottom: 10px;">GÜVENLİK: Şifre Güncelle</h4>
                    <label>Yeni Şifre</label>
                    <input type="password" id="profileNewPassword" placeholder="Değiştirmek istemiyorsanız boş bırakın">
                    <label>Yeni Şifre Tekrar</label>
                    <input type="password" id="profileConfirmPassword">
                </div>
                
                <button type="submit" class="btn btn-warning" style="width: 100%; justify-content: center; margin-top: 20px; background: var(--primary);">BİLGİLERİ GÜNCELLE</button>
            </form>
            <button onclick="document.getElementById('profileModal').style.display='none'" class="btn" style="width: 100%; justify-content: center; margin-top: 10px; background: transparent; color: var(--text-muted);">Vazgeç</button>
        </div>
    </div>

    <script src="/static/personel.js"></script>
</body>
</html>
