<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personel Paneli - Argor Lojistik</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --border-color: #334155;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            text-align: center;
        }
        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: var(--accent-blue);
            margin-top: 10px;
        }
        .task-container {
            display: grid;
            grid-template-columns: 1fr 1fr; /* İki kolon: Aktif İşler | Bitenler */
            gap: 30px;
        }
        .task-card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-finish {
            background-color: var(--accent-green);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-logout {
            background-color: transparent;
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1 style="margin: 0; font-size: 24px;">Hoş Geldin, <span id="personelName">Personel</span> 👋</h1>
            <p style="margin: 5px 0 0 0; color: var(--text-muted); font-size: 14px;">Bugünkü görevlerine bir göz atalım.</p>
        </div>
        <div>
            <button class="btn-logout" onclick="logout()">Çıkış Yap</button>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div style="color: var(--text-muted); font-size: 14px;">Bana Atanan (Bekleyen)</div>
            <div class="stat-number" id="statTodo">0</div>
        </div>
        <div class="stat-card">
            <div style="color: var(--text-muted); font-size: 14px;">Şu An Üzerinde Çalıştığım</div>
            <div class="stat-number" id="statInProgress" style="color: #f59e0b;">0</div>
        </div>
        <div class="stat-card">
            <div style="color: var(--text-muted); font-size: 14px;">Tamamladığım Görevler</div>
            <div class="stat-number" id="statDone" style="color: var(--accent-green);">0</div>
        </div>
    </div>

    <div class="task-container">
        <div>
            <h2 style="font-size: 18px; border-bottom: 2px solid var(--accent-blue); padding-bottom: 10px; display: inline-block;">🔥 Aktif Görevlerim</h2>
            <div id="activeTasksList">
                <p style="color: var(--text-muted);">Yükleniyor...</p>
            </div>
        </div>

        <div>
            <h2 style="font-size: 18px; border-bottom: 2px solid var(--accent-green); padding-bottom: 10px; display: inline-block;">✅ Biten İşler</h2>
            <div id="completedTasksList">
                <p style="color: var(--text-muted);">Yükleniyor...</p>
            </div>
        </div>
    </div>

    <script src="personel.js"></script>
    <script>
        function logout() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
